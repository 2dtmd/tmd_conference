# Build and deploy the production and demo Jekyll sites to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - Demo
      - Prod

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: Prod
          path: Prod-source

      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: Demo
          path: Demo-source

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.1"

      # Detects whether the site currently uses github.io or a custom domain
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # Production site
      # github.io: /tmd_conference/
      # custom domain: /
      # ------------------------------------------------------------

      - name: Install production dependencies
        working-directory: ./Prod-source/tmd_conference
        run: bundle install

      - name: Build production site
        working-directory: ./Prod-source/tmd_conference
        env:
          JEKYLL_ENV: production
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          cat > _config_deploy.yml <<EOF
          url: "${SITE_ORIGIN}"
          baseurl: "${SITE_BASE_PATH}"
          EOF

          echo "Production URL: ${SITE_ORIGIN}${SITE_BASE_PATH}/"

          bundle exec jekyll build \
            --config _config.yml,_config_deploy.yml \
            --destination "../../_site"

      # ------------------------------------------------------------
      # Demo site
      # github.io: /tmd_conference/dcuenvoieuriewud2dhfhf/
      # custom domain: /dcuenvoieuriewud2dhfhf/
      # ------------------------------------------------------------

      - name: Install demo dependencies
        working-directory: ./Demo-source/tmd_conference
        run: bundle install

      - name: Build demo site
        working-directory: ./Demo-source/tmd_conference
        env:
          JEKYLL_ENV: production
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DEMO_FOLDER: dcuenvoieuriewud2dhfhf
        run: |
          set -euo pipefail

          DEMO_BASE_PATH="${SITE_BASE_PATH}/${DEMO_FOLDER}"

          cat > _config_deploy.yml <<EOF
          url: "${SITE_ORIGIN}"
          baseurl: "${DEMO_BASE_PATH}"
          EOF

          echo "Demo URL: ${SITE_ORIGIN}${DEMO_BASE_PATH}/"

          bundle exec jekyll build \
            --config _config.yml,_config_deploy.yml \
            --destination "../../_site/${DEMO_FOLDER}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
