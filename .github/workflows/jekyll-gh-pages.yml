# Build and deploy the production and demo Jekyll sites to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Rebuild the complete Pages site when either branch changes
  push:
    branches:
      - Demo
      - Prod

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the production branch
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: Prod
          path: Prod-source

      # Check out the demo branch into a separate directory
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: Demo
          path: Demo-source

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.1"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Production website:
      # https://2dtmd.github.io/tmd_conference/
      - name: Install production dependencies
        working-directory: ./Prod-source/tmd_conference
        run: bundle install

      - name: Build production site
        working-directory: ./Prod-source/tmd_conference
        run: |
          bundle exec jekyll build \
            --baseurl "/tmd_conference" \
            --destination "../../_site"
        env:
          JEKYLL_ENV: production

      # Demo website:
      # https://2dtmd.github.io/tmd_conference/dcuenvoieuriewud2dhfhf/
      - name: Install demo dependencies
        working-directory: ./Demo-source/tmd_conference
        run: bundle install

      - name: Build demo site
        working-directory: ./Demo-source/tmd_conference
        run: |
          bundle exec jekyll build \
            --baseurl "/tmd_conference/dcuenvoieuriewud2dhfhf" \
            --destination "../../_site/dcuenvoieuriewud2dhfhf"
        env:
          JEKYLL_ENV: production

      # Upload both sites together as one GitHub Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
